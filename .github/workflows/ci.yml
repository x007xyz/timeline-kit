name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: |
          pnpm run typecheck
          pnpm run typecheck:adapters

      - name: Unit tests
        run: pnpm test

      - name: Build library
        run: pnpm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: E2E tests (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm run test:e2e
